# 本地开发环境（M1/M2 阶段：直连本机映射的 Docker MySQL 8.4；密钥走本地环境变量）
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/teapot_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL

rbac:
  jwt:
    # 仅本地开发兜底；生产由 app.env 的 RBAC_JWT_SECRET 注入（SPEC §13/§14）
    secret: ${RBAC_JWT_SECRET:teapot-ai-dev-only-secret-do-not-use-in-prod}

logging:
  level:
    com.teamer.teapot.ai: debug
    io.agentscope: debug
