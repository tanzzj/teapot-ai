# 生产环境（114.116.14.26，SPEC §11/§13/§14）：全部密钥仅通过环境变量注入，零落盘
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/teapot_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL

teapot:
  ai:
    agentscope:
      workspace-root: ${AGENTSCOPE_WORKSPACE:/main/apps/teapot-ai/workspace}
      # 存储拆分（SPEC §26 修订/§27）：会话状态默认 MySQL，记忆文件系统路由 Redis；密码由 app.env 注入
      redis:
        session-store: ${TEAPOT_REDIS_SESSION_STORE:false}
        memory-store: ${TEAPOT_REDIS_MEMORY_STORE:true}
        migrate-legacy-memory: ${TEAPOT_REDIS_MIGRATE_LEGACY_MEMORY:false}
        host: 127.0.0.1
        port: 6379
        password: ${TEAPOT_REDIS_PASSWORD:}
        session-key-prefix: "teapot:session:"
        memory-key-prefix: "teapot:memory:"

logging:
  file:
    name: /main/apps/teapot-ai/logs/teapot-ai.log
  level:
    com.teamer.teapot.ai: info
